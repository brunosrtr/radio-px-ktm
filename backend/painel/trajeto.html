<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Rádio PX Digital — Trajeto</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
  #login { max-width: 420px; margin: 40px auto; padding: 24px; border: 1px solid #ddd; border-radius: 8px; }
  #login input { width: 100%; padding: 8px; margin: 6px 0; box-sizing: border-box; }
  #login button { width: 100%; padding: 10px; }
  #erro, #erroConsulta { color: #b00020; min-height: 1.2em; }
  #consulta {
    display: none; max-width: 900px; margin: 16px auto; padding: 0 16px;
    gap: 8px; align-items: center; flex-wrap: wrap;
  }
  #consulta input { padding: 8px; }
  #consulta button { padding: 8px 16px; }
  #mapa { height: 70vh; width: 100%; display: none; }
</style>
</head>
<body>
  <div id="login">
    <h2>Rádio PX Digital — Trajeto</h2>
    <input id="loginInput" placeholder="Login (admin)" autocomplete="username" />
    <input id="senhaInput" type="password" placeholder="Senha" autocomplete="current-password" />
    <button id="entrarBtn">Entrar</button>
    <p id="erro"></p>
    <p><a href="mapa.html">← Ver posição atual no mapa</a></p>
  </div>

  <div id="consulta">
    <input id="motoristaIdInput" placeholder="ID do motorista" size="38" />
    <input id="deInput" type="datetime-local" />
    <input id="ateInput" type="datetime-local" />
    <button id="consultarBtn">Consultar trajeto</button>
    <p id="erroConsulta" style="width: 100%"></p>
  </div>
  <div id="mapa"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const API_BASE = window.location.origin;
    let token = null;
    let mapa = null;
    let linha = null;

    document.getElementById('entrarBtn').addEventListener('click', entrar);
    document.getElementById('consultarBtn').addEventListener('click', consultarTrajeto);

    async function entrar() {
      const login = document.getElementById('loginInput').value.trim();
      const senha = document.getElementById('senhaInput').value;
      const erroEl = document.getElementById('erro');
      erroEl.textContent = '';

      try {
        const resp = await fetch(API_BASE + '/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ login, senha }),
        });
        if (!resp.ok) throw new Error('login ou senha incorretos');
        token = (await resp.json()).token;

        document.getElementById('login').style.display = 'none';
        document.getElementById('consulta').style.display = 'flex';
        document.getElementById('mapa').style.display = 'block';

        mapa = L.map('mapa').setView([-28.45, -52.20], 8);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; colaboradores do OpenStreetMap',
        }).addTo(mapa);
      } catch (e) {
        erroEl.textContent = e.message;
      }
    }

    async function consultarTrajeto() {
      const erroEl = document.getElementById('erroConsulta');
      erroEl.textContent = '';

      const motoristaId = document.getElementById('motoristaIdInput').value.trim();
      const de = document.getElementById('deInput').value;
      const ate = document.getElementById('ateInput').value;
      if (!motoristaId || !de || !ate) {
        erroEl.textContent = 'preencha o ID do motorista e o período (de/até)';
        return;
      }

      const params = new URLSearchParams({
        de: new Date(de).toISOString(),
        ate: new Date(ate).toISOString(),
      });

      const resp = await fetch(API_BASE + '/motoristas/' + motoristaId + '/trajeto?' + params, {
        headers: { Authorization: 'Bearer ' + token },
      });

      if (linha) {
        mapa.removeLayer(linha);
        linha = null;
      }

      if (!resp.ok) {
        const corpo = await resp.json().catch(() => ({}));
        erroEl.textContent = corpo.mensagem || 'erro ao consultar trajeto';
        return;
      }

      const dados = await resp.json();
      if (dados.trajeto.length === 0) {
        erroEl.textContent = 'nenhum ponto encontrado no período informado';
        return;
      }

      const pontos = dados.trajeto.map((p) => [p.latitude, p.longitude]);
      linha = L.polyline(pontos, { color: 'blue' }).addTo(mapa);
      mapa.fitBounds(linha.getBounds());
    }
  </script>
</body>
</html>
